[project]
name = "anvil"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tim MacKay", email = "tim_mackay_git@fastmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.2",
    "idea-refiner[anthropic,openai]",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
idea-refiner = { workspace = true }

[tool.fastapi]
entrypoint = "anvil.main:app"

[tool.alembic]
script_location = "%(here)s/alembic"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

# Lint and format each newly generated migration so it passes pre-commit/CI.
[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "httpx2>=2.16.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "shellcheck-py>=0.11.0.1",
    "ty>=0.0.89",
    "zizmor>=1.31.1",
]

[tool.ruff]
# Skills' docs aren't project code.
extend-exclude = [".claude"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "FAST"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise make ruff treat
# the alembic package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Keep the template's op/sa/sqlmodel imports for hand-written migrations.
"alembic/versions/*" = ["F401"]
