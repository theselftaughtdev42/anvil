[project]
name = "anvil"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tim MacKay", email = "tim_mackay_git@fastmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "anvil.main:app"

[tool.alembic]
script_location = "%(here)s/alembic"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

# Lint and format each newly generated migration so it passes pre-commit/CI.
[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
# Skills' docs aren't project code.
extend-exclude = [".claude"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "FAST"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise make ruff treat
# the alembic package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Keep the template's op/sa/sqlmodel imports for hand-written migrations.
"alembic/versions/*" = ["F401"]
