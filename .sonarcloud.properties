# Design prototypes are throwaway HTML kept for the record, not product code.
sonar.exclusions=docs/design/prototypes/**

# Findings we've accepted, with the reason for each.
sonar.issue.ignore.multicriteria=lintTests,smokeHttp,ciBuild

# The tests run through RuleTester.run, which Sonar doesn't count as tests.
sonar.issue.ignore.multicriteria.lintTests.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.lintTests.resourceKey=frontend/lint/anvil.test.ts

# The smoke test calls the local container that `compose port` exposes, so
# plain HTTP never leaves the machine.
sonar.issue.ignore.multicriteria.smokeHttp.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.smokeHttp.resourceKey=scripts/smoke-test-image.sh

# CI installs the dev group, and actionlint-py publishes no wheel, so uv must
# build it from source there. The Dockerfile installs without dev deps and
# passes --no-build.
sonar.issue.ignore.multicriteria.ciBuild.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.ciBuild.resourceKey=.github/workflows/ci.yml
