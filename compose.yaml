services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # 0 picks a free host port (the image smoke test uses this to run
      # alongside the dev database).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      # Poll every second while starting, so `up --wait` returns as soon as
      # it's ready, then settle to every 10s.
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5

  # The production image (see Dockerfile), only with `--profile image`:
  # migrations as a one-off run, then the app, as in a production deploy.
  migrate:
    profiles: [image]
    image: &app-image ${APP_IMAGE:-anvil:local}
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: [image]
    image: *app-image
    environment: *app-env
    ports:
      - "${APP_PORT:-8001}:8000"
    # Lets `up --wait` return only once the app is serving. Compose-only: the
    # image itself has no HEALTHCHECK (platforms run their own probes).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      # As for db: fast while starting, then every 10s.
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
