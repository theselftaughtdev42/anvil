# Install once with: uv run pre-commit install
# Local hooks run the tool versions pinned in uv.lock / frontend/package-lock.json,
# so they match CI.
exclude: ^\.claude/ # skills are vendored docs, not project code

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch # main is PR-only
      - id: check-merge-conflict
      - id: check-case-conflict # macOS is case-insensitive, CI isn't
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: check-docstrings
        name: check docstrings
        entry: uv run python scripts/check_docstrings.py
        language: system
        types: [python]
      # Compares each file with HEAD, so it checks local changes only: CI's
      # checkout has none.
      - id: comment-only-changes
        name: comment-only changes
        entry: uv run python scripts/check_comment_only_changes.py
        language: system
        types_or: [python, pyi, ts, tsx, javascript, jsx]
        # A backend docstring edit regenerates a comment-only hunk in api-schema.
        exclude: ^frontend/src/(components/ui/|lib/api-schema\.d\.ts$)
      # Type checkers look at the whole project (a change in one file can break
      # another), so they get no filenames and run when any relevant file changes.
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # Fails when the checked-in frontend API types are stale, after fixing
      # them, like ruff-format. Before oxlint and tsc, so they see the new file.
      - id: api-schema
        name: generate frontend API types
        entry: uv run python scripts/generate_api_schema.py
        language: system
        files: ^(src/anvil/|scripts/generate_api_schema\.py$)
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/
        types_or: [ts, tsx, json]
        pass_filenames: false
      # Workflow mistakes (bad expressions, unknown keys) plus shellcheck on
      # `run:` scripts, using the shellcheck from shellcheck-py in the venv.
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      # Workflow security: script injection, broad permissions, unpinned
      # actions. Offline, so it needs no token and gives the same result
      # locally and in CI.
      - id: zizmor
        name: zizmor
        entry: uv run zizmor --offline
        language: system
        files: ^\.github/(workflows/.*|dependabot)\.ya?ml$
