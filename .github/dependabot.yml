version: 2
updates:
  # Bumps the SHA-pinned actions in .github/workflows (and their # vX.Y.Z comments).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle for a week before proposing them.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
