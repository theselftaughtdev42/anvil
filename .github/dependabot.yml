version: 2
# Each update gets one category label for the PR labels check and the
# release notes (.github/release.yml). Setting labels replaces Dependabot's
# defaults.
updates:
  # Bumps the SHA-pinned actions in .github/workflows (and their # vX.Y.Z comments).
  # CI tooling, so left out of release notes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [internal]
    # Let new releases settle for a week before proposing them.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies in uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # Frontend dependencies in frontend/package-lock.json.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  # The /frontend entry doesn't bump this local package's own ranges. Watched
  # for the release that supports TypeScript 7 (see docs/adr/0001), whose PR
  # also needs `npm install` in frontend to update the lockfile.
  - package-ecosystem: npm
    directory: /frontend/tools/openapi-typescript
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 7
    allow:
      - dependency-name: openapi-typescript

  # The postgres image in compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 7

  # The digest-pinned base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
