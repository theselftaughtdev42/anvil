name: Trivy

# Rescans the published main image weekly, because new vulnerabilities are
# found in images that haven't changed. Reports to the Security tab only.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      # For trivy.yaml and any .trivyignore.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/theselftaughtdev42/anvil:main
          trivy-config: trivy.yaml
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
