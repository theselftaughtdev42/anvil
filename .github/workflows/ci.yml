name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every pre-commit hook, so CI checks exactly what local commits do.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # The oxlint and tsc hooks need frontend/node_modules.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch # would fail on pushes to main

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Postgres comes from compose.yaml + .env.example, same as local dev.
      # .env also gives the app and tests their DATABASE_URL.
      - run: cp .env.example .env
      # Pull the image in the background so it overlaps with the steps below.
      - run: docker compose pull --quiet > /dev/null 2>&1 &
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # Build the frontend so the /api 404 test runs instead of skipping.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      # Joins the background pull if it's still running, then waits for the
      # healthcheck in compose.yaml.
      - run: docker compose up -d --wait
      - run: uv run pytest

  # Builds and smoke-tests the production image on every run, so a PR that
  # breaks the image fails before merge. Only pushes to main publish to GHCR.
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/theselftaughtdev42/anvil
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Layer cache in the GitHub Actions cache. The docker-container builder
      # can export to it, and the runtime action exposes the cache service's
      # URL and token to the `run` step below.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # Same build as `make image` locally. --load puts the image in the local
      # Docker for the smoke test and push.
      - run: >-
          make image
          IMAGE=anvil:ci
          COMMIT="$GITHUB_SHA"
          BUILD_FLAGS="--platform linux/amd64 --load
          --cache-from type=gha --cache-to type=gha,mode=max"

      - name: Smoke test
        run: scripts/smoke-test-image.sh anvil:ci "$GITHUB_SHA"

      - if: github.event_name == 'push'
        name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          for tag in "sha-$GITHUB_SHA" main; do
            docker tag anvil:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
